<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="btn" data-cmd="brief" title="Show the brief">Brief</button>
    <span class="file-name" id="file-name"></span>
    <span class="status" id="status"></span>
    <span class="grow"></span>
    <button class="btn" data-cmd="run" id="run-btn" title="Run the program (⌘R)">Run</button>
    <button class="btn" data-cmd="test" title="Run the hidden tests (⌘↩)">Test</button>
    <button class="btn primary" data-cmd="submit" title="Send your work to your teacher (⇧⌘↩)">Submit</button>
  </header>
  <div class="main">
    <aside class="files">
      <div class="files-head"><span>Files</span><button class="icon" data-cmd="new" title="New file">+</button></div>
      <ul id="file-list"></ul>
    </aside>
    <section class="work">
      <div id="brief" class="brief" hidden></div>
      <div id="editor"></div>
      <div class="splitter" id="splitter" title="Drag to resize"></div>
      <div class="output">
        <div class="output-head"><span id="output-title">Output</span><span class="grow"></span><button class="icon" data-cmd="clear" title="Clear">×</button></div>
        <pre id="output" class="output-body"><span class="muted">Run your program or the tests: their output appears here. The tests themselves stay hidden.</span></pre>
      </div>
    </section>
  </div>
</div>
<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/codemirror.js"></script>
<script src="editor.js"></script>
</body>
</html>
